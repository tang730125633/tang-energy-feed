<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">tang-energy-feed</title>
  <desc id="desc">暖纸背景上的能源新闻与铜价流向 JSON feed，再被脚本和飞书消费的示意。</desc>
  <rect width="1200" height="390" rx="28" fill="#F7F0E5"/>
  <path d="M64 58H1136M64 332H1136" stroke="#173B32" stroke-opacity=".2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="92" fill="#B66C3E" font-size="20" font-weight="700" letter-spacing="2">ENERGY DATA BRIEF</text>
    <text x="64" y="158" fill="#173B32" font-size="58" font-weight="750">tang-energy-feed</text>
    <text x="64" y="202" fill="#35554A" font-size="27">能源新闻与铜价，变成可验证的 JSON feed。</text>
    <text x="64" y="255" fill="#173B32" font-size="21" font-weight="650">订阅 feed</text>
    <circle cx="178" cy="248" r="5" fill="#B66C3E"/>
