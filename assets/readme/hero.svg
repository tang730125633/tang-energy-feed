    <circle cx="326" cy="248" r="5" fill="#B66C3E"/>
    <text x="342" y="255" fill="#173B32" font-size="21" font-weight="650">云端推送</text>
    <text x="64" y="299" fill="#6A7A71" font-size="20">publish once · inspect each snapshot · consume where it fits</text>
  </g>
  <g id="source-inputs" transform="translate(665 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="-14" fill="#6A7A71" font-size="20" font-weight="700">PUBLISHER</text>
