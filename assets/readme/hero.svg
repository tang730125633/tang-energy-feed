    <text x="230" y="38" fill="#E7C59D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">feed-digest.json</text>
    <path d="M230 60H448" stroke="#FFFFFF" stroke-opacity=".2"/>
    <text x="230" y="94" fill="#F7F0E5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">sources[]</text>
    <text x="230" y="126" fill="#F7F0E5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">articles[]</text>
    <text x="230" y="158" fill="#E7C59D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">copper</text>
    <text x="230" y="190" fill="#F7F0E5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">errors + stats</text>
    <path d="M356 151C378 140 389 166 410 132S433 115 450 104" fill="none" stroke="#B66C3E" stroke-width="4" stroke-linecap="round"/>
